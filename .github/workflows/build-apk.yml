name: Build Android APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    name: Build APK Debug
    runs-on: ubuntu-latest
    if: "! contains(github.event.head_commit.message, 'Merge remote-tracking branch')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v3.12.0
        with:
          distribution: "temurin"
          java-version: 17
          cache: 'gradle'

      - name: fix
        run:
          mkdir -p /home/runner/.config/.android
          chmod 777 /home/runner/.config/.android

      - name: Setup cmake
        run: |
          echo "y" | sudo ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1" --sdk_root=${ANDROID_SDK_ROOT}
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2.8.0

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleAppDebug --build-cache --parallel --warning-mode all
          echo "APK_FILE=$(find app/build/outputs/apk/app/debug -name '*.apk')" >> $GITHUB_ENV

      - name: Show Debug APK SHA256
        run: |
          echo "### Build Debug Success :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "|ABI|SHA256|" >> $GITHUB_STEP_SUMMARY
          echo "|:--------:|:----------|" >> $GITHUB_STEP_SUMMARY
          sha256sum ${{ env.APK_FILE }} | awk '{print "|arm64|"$1"|"}' >> $GITHUB_STEP_SUMMARY

      - name: Upload Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: Shamrock-debug-${{ github.event.head_commit.id }}-arm64
          path: ${{ env.APK_FILE }}





